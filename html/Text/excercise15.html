<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .header{
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      height:50px;
      background-color: rgb(92, 0, 128);
      align-items: center;
    }
    .home{
      color: white;
      padding-left: 10px;
      font-family: Arial;
    }
  .input {
  flex: 1;
  height: 30px;
  border-radius: 15px;
  max-width: 300px;
  width: 0;
}
    .dow{
      background-color: rgb(92, 0, 128);
      border: none;
      color: white;
      height: 30px;
      border-radius: 3px;
      border-color: white;
      border-style: solid;
      border-width: 1px;
      margin-right: 10px;
    }
  </style>
</head>
<body>
  <div class="header">

  <div class="home">
    Home
  </div>

  <input class="input" type="text" placeholder="Search">

  <button class="dow">Download</button>

</div>

</body>
</html>
